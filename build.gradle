plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.3' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.3' apply false
}
def targets = [mc12111: ['1.21.11','0.141.6+1.21.11',21], mc2610: ['26.1','0.145.1+26.1',25], mc2611: ['26.1.1','0.145.4+26.1.1',25], mc261: ['26.1.2','0.155.3+26.1.2',25], mc262: ['26.2','0.161.0+26.2',25], mc263: ['26.3','0.162.0+26.3',25]]
subprojects {
    def t = targets[project.name]
    apply plugin: project.name == 'mc12111' ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
    version = '1.5.0'
    group = 'dev.bettermusic'
    base { archivesName = "better-music-overlay-${t[0]}" }
    repositories { mavenCentral() }
    dependencies {
        minecraft "com.mojang:minecraft:${t[0]}"
        if (project.name == 'mc12111') mappings loom.officialMojangMappings()
        add(project.name == 'mc12111' ? 'modImplementation' : 'implementation', 'net.fabricmc:fabric-loader:0.19.5')
        add(project.name == 'mc12111' ? 'modImplementation' : 'implementation', "net.fabricmc.fabric-api:fabric-api:${t[1]}")
        implementation 'org.yaml:snakeyaml:2.7'
        include 'org.yaml:snakeyaml:2.7'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    java { sourceCompatibility = t[2]; targetCompatibility = t[2]; withSourcesJar() }
    def generated = layout.buildDirectory.dir('generated/sources/overlay')
    tasks.register('generateSources') {
        inputs.dir rootProject.file('src/main/java')
        if (project.hasProperty('smoke')) inputs.dir rootProject.file('src/smoke/java')
        inputs.property 'smoke', project.hasProperty('smoke')
        outputs.dir generated
        doLast {
            sync {
                from rootProject.file('src/main/java'); into generated
                if (project.hasProperty('smoke')) from rootProject.file('src/smoke/java')
                filter { line ->
                    if (project.name == 'mc263') line = line.replace('client.getMainRenderTarget()', 'client.gameRenderer.mainRenderTarget()')
                    if (project.name in ['mc262', 'mc263']) line = line.replace('.setScreen(', '.gui.setScreen(').replace('client.screen', 'client.gui.screen()').replace('mc.screen', 'mc.gui.screen()').replace('.resizeDisplay()', '.resizeGui()')
                    if (project.name != 'mc12111') return line.replace('GuiGraphics', 'GuiGraphicsExtractor').replace('drawString(Minecraft', 'text(Minecraft').replace('void render(', 'void extractRenderState(').replace('super.render(', 'super.extractRenderState(').replace('void renderWidget(', 'void extractWidgetRenderState(').replace('void renderContents(', 'void extractContents(').replace('void renderBackground(', 'void extractBackground(').replace('ClientCommandManager','ClientCommands').replace('keybinding.v1.KeyBindingHelper','keymapping.v1.KeyMappingHelper').replace('KeyBindingHelper.registerKeyBinding','KeyMappingHelper.registerKeyMapping')
                    return line
                }
            }
        }
    }
    sourceSets.main.java.srcDirs = [generated]
    sourceSets.main.resources.srcDirs = [rootProject.file('src/main/resources')]
    sourceSets.test.java.srcDirs = [rootProject.file('src/test/java')]
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = t[2] }
    compileJava.dependsOn generateSources
    sourcesJar.dependsOn generateSources
    jar { from(rootProject.file('LICENSE')) }
    processResources {
        inputs.property 'mod_version', project.version
        inputs.property 'minecraft_version', t[0]
        inputs.property 'smoke', project.hasProperty('smoke')
        filesMatching('fabric.mod.json') { expand(version: project.version, minecraft_version: t[0], java_version: t[2]) }
        doLast {
            if (project.hasProperty('smoke')) {
                def metadata = new File(destinationDir, 'fabric.mod.json')
                def json = new groovy.json.JsonSlurper().parse(metadata)
                json.entrypoints.client.add('dev.bettermusic.DevelopmentSmoke')
                metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }
    }
    test { useJUnitPlatform() }
}
